<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
    <title>Athena Pi</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f7ff',
                            100: '#ebf0fe',
                            200: '#dae3fd',
                            300: '#bdccfa',
                            400: '#94a9f5',
                            500: '#6d81f0',
                            600: '#5261e6',
                            700: '#434ed1',
                            800: '#3a42ab',
                            900: '#343a88',
                            950: '#22254f',
                        },
                    }
                }
            }
        }
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%23434ed1'/%3E%3Cpath d='M35 30 L35 70 L75 50 Z' fill='white'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        .glass-card { 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
        }
        .progress-bar { transition: width 0.3s ease-out; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 selection:bg-brand-100 dark:selection:bg-brand-900/30"
      x-data="athenaApp()" x-init="init()">
    
    <!-- Top Bar Controls -->
    <div class="fixed top-6 right-6 z-50 flex items-center gap-3">
        <!-- yt-dlp Update -->
        <button @click="checkYtdlpUpdate()" 
                :disabled="checkingUpdate" 
                class="flex items-center justify-center w-10 h-10 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition-all disabled:opacity-50" 
                title="yt-dlp aktualisieren">
            <svg x-show="!checkingUpdate" class="w-5 h-5 text-slate-600 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            <svg x-show="checkingUpdate" class="animate-spin w-5 h-5 text-brand-600" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
            </svg>
        </button>
        <!-- Theme Toggle -->
        <button @click="toggleTheme()" 
                class="flex items-center justify-center w-10 h-10 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition-all">
            <svg x-show="!darkMode" class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            <svg x-show="darkMode" class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
    </div>

    <!-- Toast Notifications -->
    <div x-show="updateStatus" 
         x-transition:enter="transition ease-out duration-300" 
         x-transition:enter-start="opacity-0 translate-y-4" 
         x-transition:enter-end="opacity-100 translate-y-0" 
         class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-2xl flex items-center gap-3" x-cloak>
        <span x-text="updateStatus" class="text-sm font-medium"></span>
        <button @click="updateStatus = null" class="opacity-50 hover:opacity-100 transition-opacity">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <!-- Login Overlay -->
    <div x-show="showLogin" x-transition class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-md" x-cloak>
        <div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-600 text-white mb-6">
                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                </div>
                <h2 class="text-2xl font-bold">Willkommen zurück</h2>
                <p class="text-slate-500 dark:text-slate-400 mt-2">Bitte authentifiziere dich.</p>
            </div>
            <div class="space-y-4">
                <input 
                    type="password" 
                    x-model="password"
                    @keydown.enter="login()"
                    placeholder="Passwort"
                    class="w-full px-5 py-4 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all"
                >
                <button 
                    @click="login()"
                    :disabled="!password || loggingIn"
                    class="w-full py-4 rounded-xl bg-brand-600 text-white font-bold hover:bg-brand-700 active:scale-[0.98] disabled:opacity-50 transition-all shadow-lg shadow-brand-500/20"
                >
                    <span x-show="!loggingIn">Anmelden</span>
                    <span x-show="loggingIn" class="flex items-center justify-center gap-2">
                        <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg>
                        Wird geladen...
                    </span>
                </button>
                <p x-show="loginError" x-text="loginError" class="text-center text-sm font-medium text-red-500" x-cloak></p>
            </div>
        </div>
    </div>

    <main class="min-h-full flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-xl">
            
            <!-- Header -->
            <div class="text-center mb-12">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-600 text-white mb-6 shadow-xl shadow-brand-500/20 ring-1 ring-brand-500/50">
                    <svg class="w-8 h-8 ml-1" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white">Athena Pi</h1>
                <p class="text-slate-500 dark:text-slate-400 mt-3 font-medium">Einfach, schnell, zuverlässig.</p>
            </div>

            <!-- Main Card -->
            <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-xl border border-slate-200 dark:border-slate-800">
                <div class="p-8 sm:p-10">
                    
                    <!-- URL Input -->
                    <div class="relative">
                        <input 
                            type="url" 
                            x-model="url"
                            @keydown.enter="analyze()"
                            placeholder="Video-Link hier einfügen..."
                            class="w-full pl-6 pr-16 py-5 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all text-lg font-medium"
                            :disabled="loading"
                        >
                        <button 
                            @click="analyze()"
                            :disabled="!url || loading"
                            class="absolute right-3 top-3 bottom-3 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white transition-all disabled:opacity-50"
                        >
                            <svg x-show="!loading" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                            </svg>
                            <svg x-show="loading" class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Error State -->
                    <div x-show="error" x-transition class="mt-6 p-4 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-sm font-semibold text-center" x-text="error" x-cloak></div>

                    <!-- Result Section -->
                    <div x-show="videoInfo" x-transition:enter="transition ease-out duration-300" class="mt-10 space-y-8" x-cloak>
                        
                        <!-- Media Card -->
                        <div class="flex flex-col sm:flex-row items-center gap-6 p-5 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800">
                            <img :src="videoInfo?.thumbnail" class="w-32 h-24 rounded-lg object-cover shadow-sm bg-slate-200 dark:bg-slate-800">
                            <div class="text-center sm:text-left min-w-0 flex-1">
                                <h3 x-text="videoInfo?.title" class="text-lg font-bold leading-tight truncate"></h3>
                                <p x-text="videoInfo?.author" class="text-slate-500 dark:text-slate-400 mt-1 font-medium"></p>
                            </div>
                        </div>

                        <!-- Config Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            
                            <!-- Custom Format Dropdown -->
                            <div class="relative" x-data="{ open: false }">
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Format</label>
                                <button @click="open = !open" 
                                        class="w-full flex items-center justify-between px-5 py-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-brand-500 transition-colors">
                                    <div class="flex items-center gap-3">
                                        <svg x-show="format === 'audio'" class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
                                        <svg x-show="format !== 'audio'" class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                        <span class="font-bold" x-text="format === 'audio' ? 'Audio' : 'Video'"></span>
                                    </div>
                                    <svg class="w-5 h-5 text-slate-400 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
                                </button>
                                
                                <div x-show="open" @click.away="open = false" 
                                     class="absolute z-20 w-full mt-2 p-2 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 max-h-72 overflow-y-auto" x-cloak>
                                    <button @click="format = 'video'; quality = 'best'; open = false" class="w-full flex items-center px-4 py-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700/50 font-medium transition-colors" :class="format === 'video' ? 'text-brand-600' : ''">Video</button>
                                    <button @click="format = 'audio'; quality = 'best'; open = false" class="w-full flex items-center px-4 py-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700/50 font-medium transition-colors" :class="format === 'audio' ? 'text-brand-600' : ''">Audio</button>
                                </div>
                            </div>

                            <!-- Custom Quality Dropdown -->
                            <div class="relative" x-data="{ open: false }">
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Qualität</label>
                                <button @click="open = !open" 
                                        class="w-full flex items-center justify-between px-5 py-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-brand-500 transition-colors">
                                    <div class="flex items-center gap-3">
                                        <svg class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                        <span class="font-bold" x-text="getSelectedQualityLabel()"></span>
                                    </div>
                                    <svg class="w-5 h-5 text-slate-400 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
                                </button>
                                
                                <div x-show="open" @click.away="open = false" 
                                     class="absolute z-20 w-full mt-2 p-2 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 max-h-72 overflow-y-auto" x-cloak>
                                    <template x-for="fmt in getFilteredFormats()">
                                        <button @click="quality = fmt.quality; open = false" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700/50 font-medium transition-colors" :class="quality === fmt.quality ? 'text-brand-600' : ''" x-text="fmt.label"></button>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- Action Button -->
                        <div class="pt-4">
                            <button 
                                @click="download()"
                                :disabled="downloading || completed"
                                class="relative w-full py-5 rounded-2xl font-bold text-white transition-all overflow-hidden shadow-lg"
                                :class="(downloading || completed) ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed' : 'bg-brand-600 hover:bg-brand-700 active:scale-[0.99] shadow-brand-500/20'"
                            >
                                <div x-show="downloading && !queued" class="absolute inset-0 bg-brand-500/10 origin-left progress-bar" :style="`width: ${progress}%`"></div>
                                
                                <div class="relative flex items-center justify-center gap-3 z-10">
                                    <svg x-show="downloading" class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg>
                                    <svg x-show="!downloading && !completed" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                    <svg x-show="completed" class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                                    <span x-text="downloading ? (queued ? 'In der Warteschlange...' : `Wird heruntergeladen (${progress}%)`) : (completed ? 'Abgeschlossen' : 'Download starten')"></span>
                                </div>
                            </button>
                        </div>

                        <!-- Completion Actions -->
                        <div x-show="completed" x-transition class="pt-2 flex flex-col sm:flex-row gap-4" x-cloak>
                            <a :href="downloadUrl + (authToken ? (downloadUrl.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(authToken) : '')" 
                               download 
                               class="flex-1 py-4 bg-emerald-600 hover:bg-emerald-700 text-white text-center rounded-2xl font-bold shadow-lg shadow-emerald-500/20 transition-all active:scale-[0.99]">
                                Datei speichern
                            </a>
                            <button @click="reset()" class="px-8 py-4 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold transition-all active:scale-[0.99]">
                                Neues Video
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer class="mt-12 text-center text-slate-400 dark:text-slate-600 text-sm font-medium">
                &copy; 2026 Athena Pi Downloader &bull; Built with Rust
            </footer>
        </div>
    </main>

    <script>
        function athenaApp() {
            return {
                url: '',
                format: 'video',
                quality: 'best',
                loading: false,
                downloading: false,
                completed: false,
                queued: false,
                progress: 0,
                error: null,
                videoInfo: null,
                downloadId: null,
                downloadUrl: null,
                darkMode: false,
                isAuthenticated: false,
                showLogin: false,
                authToken: null,
                password: '',
                loggingIn: false,
                loginError: null,
                eventSource: null,
                checkingUpdate: false,
                updateStatus: null,

                getFilteredFormats() {
                    if (!this.videoInfo || !this.videoInfo.formats) return [];
                    return this.videoInfo.formats.filter(f => f.media_type === this.format);
                },

                getSelectedQualityLabel() {
                    if (!this.videoInfo || !this.videoInfo.formats) return 'Beste Qualität';
                    const found = this.videoInfo.formats.find(f => f.media_type === this.format && f.quality === this.quality);
                    return found ? found.label : 'Beste Qualität';
                },

                async init() {
                    // Dark Mode
                    this.darkMode = localStorage.getItem('darkMode') === 'true' || (!('darkMode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
                    this.updateTheme();
                    
                    // Token Recovery
                    const storedToken = localStorage.getItem('athena_token');
                    if (storedToken) {
                        this.authToken = storedToken;
                        this.isAuthenticated = true;
                    }
                    
                    // Config Check
                    await this.checkConfig();
                },

                async checkConfig() {
                    try {
                        const response = await fetch('/api/config');
                        const data = await response.json();
                        if (data.success && data.data) {
                            if (data.data.auth_enabled && !this.isAuthenticated) {
                                this.showLogin = true;
                            } else if (!data.data.auth_enabled) {
                                this.isAuthenticated = true;
                                this.showLogin = false;
                            }
                        }
                    } catch (e) {
                        console.error('Config fetch failed', e);
                    }
                },

                async login() {
                    if (!this.password) return;
                    this.loggingIn = true;
                    this.loginError = null;
                    try {
                        const response = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ password: this.password })
                        });
                        const data = await response.json();
                        if (data.success && data.data.token) {
                            this.authToken = data.data.token;
                            this.isAuthenticated = true;
                            this.showLogin = false;
                            localStorage.setItem('athena_token', data.data.token);
                            this.password = '';
                        } else {
                            this.loginError = 'Ungültiges Passwort';
                        }
                    } catch (e) {
                        this.loginError = 'Verbindungsfehler';
                    } finally {
                        this.loggingIn = false;
                    }
                },

                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('darkMode', this.darkMode);
                    this.updateTheme();
                },

                updateTheme() {
                    if (this.darkMode) document.documentElement.classList.add('dark');
                    else document.documentElement.classList.remove('dark');
                },

                cleanUrl(url) {
                    try {
                        const urlObj = new URL(url);
                        const videoId = urlObj.searchParams.get('v');
                        if (videoId && (urlObj.hostname.includes('youtube.com') || urlObj.hostname.includes('youtu.be'))) {
                            return `https://www.youtube.com/watch?v=${videoId}`;
                        }
                    } catch (e) {}
                    return url;
                },

                async analyze() {
                    if (!this.url) return;
                    this.loading = true;
                    this.error = null;
                    this.videoInfo = null;

                    try {
                        const response = await fetch('/api/analyze', {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                ...(this.authToken && { 'Authorization': `Bearer ${this.authToken}` })
                            },
                            body: JSON.stringify({ url: this.cleanUrl(this.url) })
                        });

                        const data = await response.json();
                        if (!data.success) throw new Error(data.error || 'Fehlgeschlagen');
                        this.videoInfo = data.data;
                    } catch (e) {
                        this.error = 'Video konnte nicht analysiert werden. Bitte Link prüfen.';
                        if (e.message.includes('Unauthorized')) this.showLogin = true;
                    } finally {
                        this.loading = false;
                    }
                },

                async download() {
                    if (!this.videoInfo) return;
                    this.downloading = true;
                    this.error = null;

                    try {
                        const response = await fetch('/api/download', {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                ...(this.authToken && { 'Authorization': `Bearer ${this.authToken}` })
                            },
                            body: JSON.stringify({ 
                                url: this.cleanUrl(this.url), 
                                format: this.format,
                                quality: this.quality 
                            })
                        });

                        const data = await response.json();
                        if (!data.success) throw new Error(data.error || 'Start fehlgeschlagen');
                        
                        this.downloadId = data.data.download_id;
                        this.queued = (data.data.status === 'queued');
                        this.connectSSE();
                    } catch (e) {
                        this.error = 'Download-Fehler: ' + e.message;
                        this.downloading = false;
                    }
                },

                connectSSE() {
                    if (this.eventSource) this.eventSource.close();
                    const tokenParam = this.authToken ? `?token=${encodeURIComponent(this.authToken)}` : '';
                    this.eventSource = new EventSource(`/api/progress/${this.downloadId}${tokenParam}`);
                    
                    this.eventSource.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        if (data.error) {
                            this.error = data.error;
                            this.downloading = false;
                            this.eventSource.close();
                            return;
                        }

                        this.queued = (data.status === 'queued');
                        this.progress = Math.round(data.progress || 0);

                        if (data.status === 'completed') {
                            this.downloading = false;
                            this.completed = true;
                            this.downloadUrl = data.download_url;
                            this.eventSource.close();
                        } else if (data.status === 'error') {
                            this.error = data.error || 'Fehler beim Herunterladen';
                            this.downloading = false;
                            this.eventSource.close();
                        }
                    };

                    this.eventSource.onerror = () => this.eventSource.close();
                },

                async checkYtdlpUpdate() {
                    this.checkingUpdate = true;
                    this.updateStatus = null;
                    try {
                        const response = await fetch('/api/ytdlp-update', { 
                            method: 'POST',
                            headers: {
                                ...(this.authToken && { 'Authorization': `Bearer ${this.authToken}` })
                            }
                        });
                        const data = await response.json();
                        if (data.success) {
                            this.updateStatus = data.data.status === 'updated' ? 'yt-dlp wurde aktualisiert' : 'Bereits aktuell';
                        } else {
                            this.updateStatus = 'Update fehlgeschlagen';
                        }
                    } catch (e) {
                        this.updateStatus = 'Verbindungsfehler';
                    } finally {
                        this.checkingUpdate = false;
                        setTimeout(() => this.updateStatus = null, 3000);
                    }
                },

                reset() {
                    this.url = '';
                    this.videoInfo = null;
                    this.format = 'video';
                    this.quality = 'best';
                    this.downloading = false;
                    this.completed = false;
                    this.progress = 0;
                    this.error = null;
                    if (this.eventSource) this.eventSource.close();
                }
            }
        }
    </script>
</body>
