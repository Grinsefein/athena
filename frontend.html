    <style>
        :root {
            --brand-400: #94a9f5;
            --brand-500: #6d81f0;
            --brand-600: #5261e6;
            --brand-700: #434ed1;
            --brand-glow: rgba(82, 97, 230, 0.45);
            --bg: #f8fafc;
            --bg-accent: rgba(109, 129, 240, 0.10);
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --surface-3: #e2e8f0;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --text: #0f172a;
            --muted: #64748b;
            --faint: #94a3b8;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --danger-text: #dc2626;
            --success: #059669;
            --shadow-card: 0 16px 48px -16px rgba(15, 23, 42, 0.18);
            --shadow-pop: 0 12px 32px -10px var(--brand-glow);
            --r-md: 12px;
            --r-lg: 16px;
            --r-xl: 24px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: light;
        }
        html.dark {
            --bg-accent: rgba(82, 97, 230, 0.07);
            --bg: #020617;
            --surface: #0f172a;
            --surface-2: #16213a;
            --surface-3: #1e293b;
            --border: #1e293b;
            --border-strong: #334155;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --faint: #64748b;
            --danger-bg: rgba(127, 29, 29, 0.22);
            --danger-border: rgba(185, 28, 28, 0.45);
            --danger-text: #fb7185;
            --success: #34d399;
            --shadow-card: 0 16px 48px -16px rgba(0, 0, 0, 0.6);
            color-scheme: dark;
        }

        *, *::before, *::after { box-sizing: border-box; }
        [x-cloak] { display: none !important; }

        html { height: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background:
                radial-gradient(1100px 500px at 50% -10%, var(--bg-accent), transparent 70%),
                var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        ::selection { background: rgba(109, 129, 240, 0.3); }

        button { font: inherit; color: inherit; }
        a { color: inherit; }

        button, input, [role="button"] {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        button:focus-visible, input:focus-visible, a:focus-visible {
            outline: 2px solid var(--brand-500);
            outline-offset: 2px;
        }

        .shell {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: calc(var(--safe-top) + 4.5rem) 1rem calc(var(--safe-bottom) + 1.25rem);
        }
        @media (min-width: 640px) {
            .shell { padding-top: calc(var(--safe-top) + 4.75rem); padding-bottom: calc(var(--safe-bottom) + 2rem); }
        }
        .wrap { width: 100%; max-width: 36rem; margin: auto; }

        /* ---------- Top bar ---------- */
        .topbar {
            position: fixed;
            top: calc(var(--safe-top) + 0.75rem);
            right: 0.875rem;
            display: flex;
            gap: 0.5rem;
            z-index: 40;
        }
        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
            transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
        }
        .icon-btn:hover { background: var(--surface-2); color: var(--text); }
        .icon-btn:active { transform: scale(0.94); }
        .icon-btn:disabled { opacity: 0.55; cursor: default; transform: none; }
        .icon-btn svg { width: 20px; height: 20px; }

        /* ---------- Hero header ---------- */
        .hero { text-align: center; margin-bottom: clamp(1.5rem, 4vw, 2.75rem); }
        .logo-badge {
            width: clamp(56px, 9vw, 64px);
            height: clamp(56px, 9vw, 64px);
            border-radius: 18px;
            background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
            color: #fff;
            display: inline-grid;
            place-items: center;
            box-shadow: var(--shadow-pop), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            margin-bottom: 1rem;
        }
        .logo-badge svg { width: 46%; height: 46%; margin-left: 6%; }
        .hero h1 {
            margin: 0;
            font-size: clamp(1.7rem, 3vw + 1rem, 2.25rem);
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .tagline { margin: 0.4rem 0 0; color: var(--muted); font-weight: 500; font-size: clamp(0.9rem, 1.5vw, 1rem); }

        /* ---------- Card ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-card);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .card-body { padding: 1.25rem; }
        @media (min-width: 640px) { .card-body { padding: 2.5rem; } }

        /* ---------- URL input ---------- */
        .input-row { position: relative; }
        .url-input {
            width: 100%;
            padding: 0.95rem 3.6rem 0.95rem 1rem;
            border-radius: var(--r-lg);
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 500;
            appearance: none;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.25s ease;
        }
        .url-input::placeholder { color: var(--faint); }
        .url-input:focus { border-color: var(--brand-500); box-shadow: 0 0 0 4px rgba(109, 129, 240, 0.18); }
        .url-input:disabled { opacity: 0.6; }
        @media (min-width: 640px) {
            .url-input { font-size: 1.0625rem; padding: 1.15rem 4.2rem 1.15rem 1.5rem; }
        }
        .go-btn {
            position: absolute;
            top: 0.4rem;
            right: 0.4rem;
            bottom: 0.4rem;
            min-width: 44px;
            padding: 0 0.85rem;
            border: none;
            border-radius: 11px;
            background: var(--brand-600);
            color: #fff;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .go-btn:hover:not(:disabled) { background: var(--brand-700); }
        .go-btn:active:not(:disabled) { transform: scale(0.94); }
        .go-btn:disabled { opacity: 0.45; cursor: default; }
        .go-btn svg { width: 20px; height: 20px; }
        @media (min-width: 640px) { .go-btn svg { width: 22px; height: 22px; } }

        /* ---------- Spinner ---------- */
        .spin {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2.5px solid currentColor;
            border-top-color: transparent;
            opacity: 0.85;
            animation: rot 0.7s linear infinite;
        }
        .spin.sm { width: 16px; height: 16px; border-width: 2px; }
        @keyframes rot { to { transform: rotate(360deg); } }

        /* ---------- Alerts / reveal animation ---------- */
        .alert-error {
            margin-top: 1rem;
            padding: 0.9rem 1rem;
            border-radius: var(--r-md);
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-text);
            font-size: 0.875rem;
            font-weight: 600;
            text-align: center;
            overflow-wrap: anywhere;
        }
        .reveal { animation: reveal 0.35s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
        @keyframes reveal {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        .result { margin-top: clamp(1.5rem, 4vw, 2.5rem); display: flex; flex-direction: column; gap: clamp(1.25rem, 3vw, 2rem); }

        /* ---------- Media card ---------- */
        .media {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 0.75rem;
            border-radius: var(--r-lg);
            background: var(--surface-2);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        @media (min-width: 640px) { .media { gap: 1.25rem; padding: 1.1rem; } }
        .media-blur {
            position: absolute;
            inset: -20px;
            background-size: cover;
            background-position: center;
            filter: blur(28px) saturate(1.2);
            opacity: 0.25;
        }
        html.dark .media-blur { opacity: 0.18; }
        .thumb {
            position: relative;
            z-index: 1;
            width: 104px;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--surface-3);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }
        @media (min-width: 640px) { .thumb { width: 140px; } }
        .media-info { position: relative; z-index: 1; min-width: 0; }
        .media-title {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .media-author, .media-duration {
            margin: 0.15rem 0 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .media-author { font-size: 0.8125rem; color: var(--muted); font-weight: 500; }
        .media-duration { font-size: 0.6875rem; color: var(--faint); font-weight: 500; }
        @media (min-width: 640px) {
            .media-title { font-size: 1.125rem; }
            .media-author { font-size: 0.875rem; }
            .media-duration { font-size: 0.75rem; }
        }

        /* ---------- Section label ---------- */
        .label {
            display: block;
            font-size: 0.6875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--faint);
            margin: 0 0 0.5rem 0.125rem;
        }

        /* ---------- Segmented control ---------- */
        .segmented {
            position: relative;
            display: flex;
            padding: 4px;
            border-radius: 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
        }
        .segmented-indicator {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: calc(50% - 4px);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.15);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html.dark .segmented-indicator { background: var(--surface-3); }
        .segmented button {
            position: relative;
            z-index: 1;
            flex: 1;
            min-height: 44px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .segmented button[aria-pressed="true"] { color: var(--brand-700); }
        html.dark .segmented button[aria-pressed="true"] { color: var(--brand-400); }

        /* ---------- Quality grid ---------- */
        .quality-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
        @media (min-width: 480px) { .quality-grid { grid-template-columns: repeat(3, 1fr); gap: 0.65rem; } }
        .q-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 64px;
            padding: 0.5rem 0.75rem;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            text-align: center;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }
        @media (min-width: 480px) { .q-card { min-height: 84px; border-radius: var(--r-lg); } }
        .q-card:hover { background: var(--surface-3); border-color: var(--border-strong); }
        .q-card:active { transform: scale(0.97); }
        .q-card.active {
            background: var(--brand-600);
            border-color: var(--brand-600);
            color: #fff;
            box-shadow: 0 10px 26px -8px var(--brand-glow);
            transform: translateY(-1px);
        }
        .q-name { font-size: 0.8125rem; font-weight: 650; overflow-wrap: anywhere; }
        .q-card.active .q-name { font-weight: 800; }
        .q-size { font-size: 0.6875rem; opacity: 0.75; }
        .best-stamp {
            position: absolute;
            top: 8px;
            right: -19px;
            width: 64px;
            padding: 2px 0;
            transform: rotate(45deg);
            background: #f59e0b;
            color: #fff;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        .expand-row { text-align: center; margin-top: 0.75rem; }
        .expand-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            min-height: 44px;
            padding: 0 0.75rem;
            border: none;
            background: transparent;
            color: var(--brand-600);
            font-size: 0.8125rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: var(--r-md);
            transition: color 0.15s ease;
        }
        html.dark .expand-btn { color: var(--brand-400); }
        .expand-btn:hover { color: var(--brand-700); }
        .expand-btn svg { width: 16px; height: 16px; transition: transform 0.2s ease; }
        .expand-btn svg.open { transform: rotate(180deg); }

        /* ---------- Playlist panel ---------- */
        .playlist-panel {
            padding: 1rem;
            border-radius: var(--r-lg);
            background: var(--surface-2);
            border: 1px solid var(--border);
        }
        @media (min-width: 640px) { .playlist-panel { padding: 1.5rem; } }
        .playlist-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.75rem; }
        .playlist-head h4 { margin: 0; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
        .playlist-actions { display: flex; gap: 0.6rem; align-items: center; flex-shrink: 0; }
        .link-btn {
            border: none;
            background: transparent;
            padding: 0.25rem 0.15rem;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--brand-600);
            cursor: pointer;
            border-radius: 6px;
        }
        html.dark .link-btn { color: var(--brand-400); }
        .link-btn.muted { color: var(--muted); }
        .playlist-list { max-height: 15rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; padding-right: 0.35rem; }
        .playlist-item {
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            padding: 0.6rem 0.65rem;
            border-radius: var(--r-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }
        .playlist-item:hover { background: var(--surface-3); border-color: var(--border); }
        .playlist-item input {
            margin-top: 0.2rem;
            width: 18px;
            height: 18px;
            accent-color: var(--brand-600);
            flex-shrink: 0;
        }
        .playlist-item span { font-size: 0.875rem; font-weight: 600; line-height: 1.35; user-select: none; }
        .playlist-count { margin: 0.6rem 0 0; text-align: right; font-size: 0.75rem; font-weight: 600; color: var(--muted); }

        /* ---------- Download button ---------- */
        .dl-btn {
            position: relative;
            width: 100%;
            min-height: 58px;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: var(--r-lg);
            background: var(--brand-600);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 14px 30px -10px var(--brand-glow);
            transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.2s ease;
        }
        .dl-btn:hover:not(:disabled) { background: var(--brand-700); }
        .dl-btn:active:not(:disabled) { transform: scale(0.99); }
        .dl-btn:disabled { background: var(--surface-2); color: var(--faint); cursor: not-allowed; box-shadow: none; }
        .dl-progress {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.16);
            transform-origin: left center;
            transition: width 0.3s ease-out;
        }
        .dl-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem; }
        .dl-main { display: flex; align-items: center; gap: 0.6rem; }
        .dl-main svg { width: 21px; height: 21px; }
        .dl-sub { display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; font-weight: 550; opacity: 0.85; }
        .done-icon { color: var(--success); }

        /* ---------- Completion actions ---------- */
        .actions { display: grid; grid-template-columns: 1fr; gap: 0.75rem; padding-top: 0.25rem; }
        @media (min-width: 480px) { .actions { grid-template-columns: 1fr 1fr; } }
        .btn-save, .btn-ghost {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 54px;
            padding: 0 1.25rem;
            border-radius: var(--r-lg);
            font-weight: 700;
            font-size: 0.9375rem;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .btn-save, .btn-ghost { border: none; }
        .btn-save { background: var(--success); color: #fff; box-shadow: 0 12px 26px -10px rgba(5, 150, 105, 0.5); }
        .btn-save:hover { background: #047857; }
        .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--surface-3); }
        .btn-save:active, .btn-ghost:active { transform: scale(0.98); }
        .btn-save svg, .btn-ghost svg { width: 18px; height: 18px; flex-shrink: 0; }

        /* ---------- Toasts ---------- */
        .toasts {
            position: fixed;
            bottom: calc(var(--safe-bottom) + 1.25rem);
            left: 50%;
            transform: translateX(-50%);
            width: min(calc(100vw - 2rem), 24rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            z-index: 60;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.9rem;
            padding: 0.85rem 1.1rem;
            border-radius: var(--r-lg);
            border: 1px solid transparent;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.45);
        }
        .toast.info { background: rgba(15, 23, 42, 0.92); border-color: rgba(255, 255, 255, 0.08); }
        .toast.error { background: rgba(225, 29, 72, 0.94); border-color: rgba(255, 255, 255, 0.15); }
        .toast.success { background: rgba(5, 150, 105, 0.94); border-color: rgba(255, 255, 255, 0.15); }
        .toast-body { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
        .toast-body svg { width: 18px; height: 18px; flex-shrink: 0; }
        .toast-msg { overflow-wrap: anywhere; }
        .toast-close {
            border: none;
            background: transparent;
            color: #fff;
            opacity: 0.65;
            cursor: pointer;
            padding: 0.35rem;
            display: grid;
            place-items: center;
            border-radius: 8px;
        }
        .toast-close:hover { opacity: 1; }
        .toast-close svg { width: 14px; height: 14px; }

        /* ---------- Login modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            padding-top: max(1rem, var(--safe-top));
            background: rgba(2, 6, 23, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .modal {
            width: 100%;
            max-width: 24rem;
            max-height: 100%;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-card);
            padding: 2rem;
        }
        .modal-head { text-align: center; margin-bottom: 1.75rem; }
        .modal-logo {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--brand-600);
            color: #fff;
            display: inline-grid;
            place-items: center;
            margin-bottom: 1.25rem;
        }
        .modal-head h2 { margin: 0; font-size: 1.375rem; font-weight: 800; letter-spacing: -0.01em; }
        .modal-head p { margin: 0.5rem 0 0; color: var(--muted); font-size: 0.9rem; }
        .modal-form { display: flex; flex-direction: column; gap: 1rem; }
        .pw-input {
            width: 100%;
            padding: 1rem 1.15rem;
            border-radius: var(--r-lg);
            border: 1px solid var(--border-strong);
            background: var(--surface-2);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .pw-input:focus { border-color: var(--brand-500); box-shadow: 0 0 0 4px rgba(109, 129, 240, 0.18); }
        .login-btn {
            min-height: 54px;
            border: none;
            border-radius: var(--r-lg);
            background: var(--brand-600);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-pop);
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .login-btn:hover:not(:disabled) { background: var(--brand-700); }
        .login-btn:active:not(:disabled) { transform: scale(0.98); }
        .login-btn:disabled { opacity: 0.5; cursor: default; }
        .login-btn span { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .login-error { margin: 0.25rem 0 0; text-align: center; font-size: 0.85rem; font-weight: 600; color: var(--danger-text); }

        /* ---------- Footer ---------- */
        .footer {
            margin-top: auto;
            padding-top: 2rem;
            text-align: center;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--faint);
        }

        /* ---------- Scrollbar ---------- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body x-data="athenaApp()" x-init="init()">

    <!-- Top Bar Controls -->
    <div class="topbar">
        <button type="button" @click="checkYtdlpUpdate()" :disabled="checkingUpdate" class="icon-btn" aria-label="yt-dlp aktualisieren" title="yt-dlp aktualisieren">
            <svg x-show="!checkingUpdate" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            <span class="spin sm" x-show="checkingUpdate" aria-hidden="true"></span>
        </button>
        <button type="button" @click="toggleTheme()" class="icon-btn" :aria-label="darkMode ? 'Light Mode aktivieren' : 'Dark Mode aktivieren'" title="Design wechseln">
            <svg x-show="!darkMode" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            <svg x-show="darkMode" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
    </div>

    <!-- Toast Notifications -->
    <div class="toasts" role="status" aria-live="polite" x-cloak>
        <template x-for="t in toasts" :key="t.id">
            <div x-show="t.visible"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 translate-y-3"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0 translate-y-2"
                 class="toast reveal" :class="t.type">
                <div class="toast-body">
                    <template x-if="t.type === 'error'">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    </template>
                    <template x-if="t.type === 'success'">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </template>
                    <template x-if="t.type !== 'error' && t.type !== 'success'">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </template>
                    <span class="toast-msg" x-text="t.message"></span>
                </div>
                <button type="button" class="toast-close" @click="dismissToast(t.id)" aria-label="Benachrichtigung schließen">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </template>
    </div>

    <!-- Login Overlay -->
    <div x-show="showLogin" x-transition.opacity.duration.300ms class="modal-overlay" x-cloak
         x-effect="if (showLogin) setTimeout(() => $refs.pwInput && $refs.pwInput.focus(), 80)">
        <div class="modal" role="dialog" aria-modal="true" aria-label="Anmeldung">
            <div class="modal-head">
                <div class="modal-logo" aria-hidden="true">
                    <svg style="width:26px;height:26px;" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                </div>
                <h2>Willkommen zurück</h2>
                <p>Bitte authentifiziere dich.</p>
            </div>
            <form class="modal-form" @submit.prevent="login()">
                <input type="password" x-ref="pwInput" x-model="password" autocomplete="current-password"
                       placeholder="Passwort" aria-label="Passwort" enterkeyhint="go">
                <button type="submit" :disabled="!password || loggingIn" class="login-btn">
                    <span x-show="!loggingIn">Anmelden</span>
                    <span x-show="loggingIn" x-cloak><span class="spin sm"></span> Wird geladen...</span>
                </button>
                <p x-show="loginError" x-text="loginError" class="login-error" role="alert" x-cloak></p>
            </form>
        </div>
    </div>

    <main class="shell">
        <div class="wrap">

            <!-- Header -->
            <header class="hero">
                <div class="logo-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <h1>Athena Pi</h1>
                <p class="tagline">Einfach, schnell, zuverlässig.</p>
            </header>

            <!-- Main Card -->
            <section class="card" aria-label="Video Downloader">
                <div class="card-body">

                    <!-- URL Input -->
                    <div class="input-row">
                        <input type="url" class="url-input" x-model="url" @keydown.enter="analyze()"
                               @paste="handlePaste($event)" placeholder="Video-Link hier einfügen..."
                               aria-label="Video-URL" inputmode="url" autocapitalize="off" autocorrect="off"
                               spellcheck="false" enterkeyhint="go" autocomplete="off" :disabled="loading">
                        <button type="button" class="go-btn" @click="analyze()" :disabled="!url || loading"
                                aria-label="Video analysieren">
                            <svg x-show="!loading" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                            </svg>
                            <span class="spin sm" x-show="loading" aria-hidden="true" style="color:#fff;"></span>
                        </button>
                    </div>

                    <!-- Error State -->
                    <div x-show="error" x-transition.opacity class="alert-error reveal" role="alert" x-text="error" x-cloak></div>

                    <!-- Result Section -->
                    <div x-show="videoInfo" class="result reveal" x-cloak>

                        <!-- Media Card -->
                        <div class="media">
                            <div class="media-blur" :style="videoInfo?.thumbnail ? `background-image:url('${videoInfo.thumbnail}')` : ''" aria-hidden="true"></div>
                            <img :src="videoInfo?.thumbnail || ''" alt="" class="thumb" loading="lazy" decoding="async">
                            <div class="media-info">
                                <h3 class="media-title" x-text="videoInfo?.title"></h3>
                                <p class="media-author" x-text="videoInfo?.author"></p>
                                <p class="media-duration" x-show="videoInfo?.duration" x-text="formatDuration(videoInfo?.duration)"></p>
                            </div>
                        </div>

                        <!-- Format Toggle -->
                        <div>
                            <label class="label">Format</label>
                            <div class="segmented" role="group" aria-label="Format wählen">
                                <div class="segmented-indicator" :style="`transform: translateX(${format === 'audio' ? '100%' : '0%'})`" aria-hidden="true"></div>
                                <button type="button" @click="selectDefaultQuality('video')" :aria-pressed="format === 'video'">Video</button>
                                <button type="button" @click="selectDefaultQuality('audio')" :aria-pressed="format === 'audio'">Audio</button>
                            </div>
                        </div>

                        <!-- Quality Grid -->
                        <div>
                            <label class="label">Qualität wählen</label>
                            <div class="quality-grid">
                                <template x-for="(fmt, idx) in getVisibleFormats()" :key="fmt.quality">
                                    <button type="button" @click="quality = fmt.quality" class="q-card"
                                            :class="{ active: quality === fmt.quality }"
                                            :aria-pressed="quality === fmt.quality">
                                        <template x-if="idx === 0">
                                            <div class="best-stamp" aria-label="Empfohlen">Best ⭐</div>
                                        </template>
                                        <span class="q-name" x-text="fmt.label + (idx === 0 ? ' ⭐' : '')"></span>
                                        <span class="q-size" x-show="fmt.filesize" x-text="fmt.filesize"></span>
                                    </button>
                                </template>
                            </div>

                            <div x-show="getFilteredFormats().length > 3" class="expand-row" x-cloak>
                                <button type="button" class="expand-btn" @click="toggleExpanded()"
                                        :aria-expanded="isExpanded()">
                                    <span x-text="isExpanded() ? 'Weniger Formate anzeigen' : 'Mehr Formate anzeigen'"></span>
                                    <svg :class="{ open: isExpanded() }" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Playlist Selection -->
                        <div x-show="videoInfo?.playlist_videos && videoInfo?.playlist_videos.length > 0" class="playlist-panel reveal" x-cloak>
                            <div class="playlist-head">
                                <h4>Playlist-Videos auswählen</h4>
                                <div class="playlist-actions">
                                    <button type="button" class="link-btn" @click="selectAllPlaylist(true)">Alle</button>
                                    <button type="button" class="link-btn muted" @click="selectAllPlaylist(false)">Keine</button>
                                </div>
                            </div>
                            <div class="playlist-list">
                                <template x-for="video in videoInfo?.playlist_videos" :key="video.id">
                                    <label class="playlist-item">
                                        <input type="checkbox" :value="video.url" x-model="selectedPlaylistUrls">
                                        <span x-text="video.title"></span>
                                    </label>
                                </template>
                            </div>
                            <p class="playlist-count" x-text="`${selectedPlaylistUrls.length} von ${videoInfo?.playlist_videos?.length || 0} Videos ausgewählt`"></p>
                        </div>

                        <!-- Action Button -->
                        <div>
                            <button type="button" class="dl-btn" @click="download()" :disabled="downloading || completed"
                                    :aria-busy="downloading">
                                <div x-show="downloading && !queued && progress > 0" class="dl-progress"
                                     :style="`width:${progress}%`" aria-hidden="true"></div>
                                <div class="dl-content">
                                    <div class="dl-main">
                                        <span class="spin" x-show="downloading" aria-hidden="true"></span>
                                        <svg x-show="!downloading && !completed" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                                        </svg>
                                        <svg x-show="completed" class="done-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                                        </svg>
                                        <span x-text="downloading ? (queued ? 'In der Warteschlange...' : `Wird heruntergeladen (${progress}%)`) : (completed ? 'Abgeschlossen' : 'Download starten')"></span>
                                    </div>
                                    <div x-show="downloading && !queued && (speed || eta)" class="dl-sub">
                                        <span x-text="speed"></span>
                                        <span x-show="speed && eta">•</span>
                                        <span x-show="eta" x-text="'ETA ' + eta"></span>
                                    </div>
                                </div>
                            </button>
                        </div>

                        <!-- Completion Actions -->
                        <div x-show="completed" class="actions reveal" x-cloak>
                            <a :href="downloadUrl + (authToken ? (downloadUrl.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(authToken) : '')"
                               download class="btn-save">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                Datei speichern
                            </a>
                            <button type="button" class="btn-ghost" @click="reset()">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                                Neues Video
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="footer">&copy; 2026 Athena Pi Downloader &bull; Built with Rust</footer>
    </main>

    <script>
        function athenaApp() {
            return {
                url: '',
                format: 'video',
                quality: 'best',
                loading: false,
                downloading: false,
                completed: false,
                queued: false,
                progress: 0,
                speed: null,
                eta: null,
                error: null,
                videoInfo: null,
                downloadId: null,
                downloadUrl: null,
                darkMode: false,
                isAuthenticated: false,
                showLogin: false,
                authToken: null,
                password: '',
                loggingIn: false,
                loginError: null,
                eventSource: null,
                checkingUpdate: false,
                toasts: [],
                selectedPlaylistUrls: [],
                videoExpanded: false,
                audioExpanded: false,
                debounceTimeout: null,

                selectAllPlaylist(val) {
                    if (val && this.videoInfo && this.videoInfo.playlist_videos) {
                        this.selectedPlaylistUrls = this.videoInfo.playlist_videos.map(v => v.url);
                    } else {
                        this.selectedPlaylistUrls = [];
                    }
                },

                toast(message, type = 'info') {
                    const id = Date.now() + Math.random().toString(36).slice(2, 7);
                    this.toasts.push({ id, message, type, visible: true });
                    if (this.toasts.length > 4) this.toasts.shift();
                    setTimeout(() => this.dismissToast(id), 4000);
                },

                dismissToast(id) {
                    const idx = this.toasts.findIndex(t => t.id === id);
                    if (idx !== -1) {
                        this.toasts[idx].visible = false;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 250);
                    }
                },

                closeSSE() {
                    if (this.eventSource) {
                        this.eventSource.close();
                        this.eventSource = null;
                    }
                },

                getFilteredFormats() {
                    if (!this.videoInfo || !this.videoInfo.formats) return [];
                    return this.videoInfo.formats.filter(f => f.media_type === this.format && f.quality !== 'best');
                },

                getVisibleFormats() {
                    const fmts = this.getFilteredFormats();
                    return this.isExpanded() ? fmts : fmts.slice(0, 3);
                },

                isExpanded() {
                    return this.format === 'video' ? this.videoExpanded : this.audioExpanded;
                },

                toggleExpanded() {
                    if (this.format === 'video') this.videoExpanded = !this.videoExpanded;
                    else this.audioExpanded = !this.audioExpanded;
                },

                selectDefaultQuality(fmtType) {
                    this.format = fmtType;
                    const formats = this.videoInfo
                        ? this.videoInfo.formats.filter(f => f.media_type === fmtType && f.quality !== 'best')
                        : [];
                    this.quality = formats.length > 0 ? formats[0].quality : 'best';
                },

                formatDuration(val) {
                    if (!val) return '';
                    if (typeof val === 'string') {
                        if (/^\d+$/.test(val)) val = parseInt(val, 10);
                        else return val.includes(':') ? val : '';
                    }
                    const seconds = Number(val);
                    if (isNaN(seconds) || seconds <= 0) return '';
                    const h = Math.floor(seconds / 3600);
                    const m = Math.floor((seconds % 3600) / 60);
                    const s = Math.floor(seconds % 60);
                    const mm = m.toString().padStart(h > 0 ? 2 : 1, '0');
                    const ss = s.toString().padStart(2, '0');
                    return h > 0 ? `${h}:${mm.padStart(2, '0')}:${ss} Std.` : `${mm}:${ss} Min.`;
                },

                isValidUrl(str) {
                    try {
                        const url = new URL(str);
                        return url.protocol === 'http:' || url.protocol === 'https:';
                    } catch (_) {
                        return false;
                    }
                },

                handlePaste(event) {
                    const pastedText = (event.clipboardData || window.clipboardData).getData('text');
                    if (pastedText) {
                        this.url = pastedText.trim();
                        if (this.isValidUrl(this.url)) {
                            this.$nextTick(() => this.analyze());
                        }
                    }
                },

                async init() {
                    this.darkMode = localStorage.getItem('darkMode') === 'true'
                        || (localStorage.getItem('darkMode') === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
                    this.updateTheme();

                    const storedToken = localStorage.getItem('athena_token');
                    if (storedToken) {
                        this.authToken = storedToken;
                        this.isAuthenticated = true;
                    }

                    await this.checkConfig();

                    const params = new URLSearchParams(window.location.search);
                    const shared = params.get('share') || params.get('url');
                    if (shared && this.isValidUrl(shared)) {
                        history.replaceState({}, '', window.location.pathname);
                        this.url = shared.trim();
                        this.$nextTick(() => this.analyze());
                        return;
                    }

                    this.$watch('url', value => {
                        if (!value || !this.isValidUrl(value)) return;
                        clearTimeout(this.debounceTimeout);
                        this.debounceTimeout = setTimeout(() => {
                            if (!this.loading && (!this.videoInfo || this.videoInfo.url !== this.cleanUrl(value))) {
                                this.analyze();
                            }
                        }, 800);
                    });
                },

                async checkConfig() {
                    try {
                        const response = await fetch('/api/config');
                        const data = await response.json();
                        if (data.success && data.data) {
                            if (data.data.auth_enabled && !this.isAuthenticated) {
                                this.showLogin = true;
                            } else if (!data.data.auth_enabled) {
                                this.isAuthenticated = true;
                                this.showLogin = false;
                            }
                        }
                    } catch (e) {
                        console.error('Config fetch failed', e);
                    }
                },

                async login() {
                    if (!this.password) return;
                    this.loggingIn = true;
                    this.loginError = null;
                    try {
                        const response = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ password: this.password })
                        });
                        const data = await response.json();
                        if (data.success && data.data && data.data.token) {
                            this.authToken = data.data.token;
                            this.isAuthenticated = true;
                            this.showLogin = false;
                            localStorage.setItem('athena_token', data.data.token);
                            this.password = '';
                            this.toast('Erfolgreich angemeldet!', 'success');
                        } else {
                            this.loginError = data.error || 'Ungültiges Passwort';
                        }
                    } catch (e) {
                        this.loginError = 'Verbindungsfehler';
                    } finally {
                        this.loggingIn = false;
                    }
                },

                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('darkMode', this.darkMode);
                    this.updateTheme();
                },

                updateTheme() {
                    document.documentElement.classList.toggle('dark', this.darkMode);
                },

                cleanUrl(url) {
                    try {
                        const urlObj = new URL(url);
                        const videoId = urlObj.searchParams.get('v');
                        if (videoId && (urlObj.hostname.includes('youtube.com') || urlObj.hostname.includes('youtu.be'))) {
                            return `https://www.youtube.com/watch?v=${videoId}`;
                        }
                    } catch (e) {}
                    return url;
                },

                async analyze() {
                    if (!this.url || this.loading) return;
                    this.loading = true;
                    this.error = null;
                    this.closeSSE();
                    this.downloading = false;
                    this.completed = false;

                    try {
                        const response = await fetch('/api/analyze', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                ...(this.authToken && { 'Authorization': `Bearer ${this.authToken}` })
                            },
                            body: JSON.stringify({ url: this.cleanUrl(this.url.trim()) })
                        });

                        let data;
                        try { data = await response.json(); } catch (_) { throw new Error('Serverfehler'); }
                        if (!response.ok || !data.success) {
                            if (response.status === 401) {
                                this.showLogin = true;
                                throw new Error('Nicht angemeldet');
                            }
                            throw new Error(data.error || 'Fehlgeschlagen');
                        }

                        this.videoInfo = data.data;
                        this.selectDefaultQuality('video');

                        if (this.videoInfo && this.videoInfo.playlist_videos) {
                            this.selectedPlaylistUrls = this.videoInfo.playlist_videos.map(v => v.url);
                        } else {
                            this.selectedPlaylistUrls = [];
                        }
                        this.toast('Analyse erfolgreich!', 'success');
                    } catch (e) {
                        if (e.message !== 'Nicht angemeldet') {
                            this.error = 'Video konnte nicht analysiert werden. Bitte Link prüfen.';
                            this.toast(this.error, 'error');
                        }
                    } finally {
                        this.loading = false;
                    }
                },

                async download() {
                    if (!this.videoInfo || this.downloading) return;
                    this.downloading = true;
                    this.completed = false;
                    this.error = null;
                    this.progress = 0;
                    this.speed = null;
                    this.eta = null;

                    try {
                        const response = await fetch('/api/download', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                ...(this.authToken && { 'Authorization': `Bearer ${this.authToken}` })
                            },
                            body: JSON.stringify({
                                url: this.cleanUrl(this.url.trim()),
                                format: this.format,
                                quality: this.quality,
                                playlist_urls: (this.videoInfo?.playlist_videos && this.selectedPlaylistUrls.length > 0)
                                    ? this.selectedPlaylistUrls : null
                            })
                        });

                        let data;
                        try { data = await response.json(); } catch (_) { throw new Error('Serverfehler'); }
                        if (!response.ok || !data.success) {
                            if (response.status === 401) {
                                this.showLogin = true;
                                throw new Error('Nicht angemeldet');
                            }
                            throw new Error(data.error || 'Start fehlgeschlagen');
                        }

                        this.downloadId = data.data.download_id;
                        this.queued = (data.data.status === 'queued');
                        this.connectSSE();
                    } catch (e) {
                        this.downloading = false;
                        if (e.message !== 'Nicht angemeldet') {
                            this.error = 'Download-Fehler: ' + e.message;
                            this.toast(this.error, 'error');
                        }
                    }
                },

                connectSSE() {
                    this.closeSSE();
                    const tokenParam = this.authToken ? `?token=${encodeURIComponent(this.authToken)}` : '';
                    const es = new EventSource(`/api/progress/${this.downloadId}${tokenParam}`);
                    this.eventSource = es;

                    es.onmessage = (event) => {
                        let data;
                        try { data = JSON.parse(event.data); } catch (_) { return; }

                        if (data.status === 'error' || data.error) {
                            this.error = data.error || 'Fehler beim Herunterladen';
                            this.toast(this.error, 'error');
                            this.downloading = false;
                            es.close();
                            this.eventSource = null;
                            return;
                        }

                        this.queued = (data.status === 'queued');
                        this.progress = Math.round(data.progress || 0);
                        this.speed = data.speed || null;
                        this.eta = data.eta || null;

                        if (data.status === 'completed') {
                            this.downloading = false;
                            this.completed = true;
                            this.downloadUrl = data.download_url;
                            this.toast('Download abgeschlossen!', 'success');
                            es.close();
                            this.eventSource = null;
                        }
                    };

                    es.onerror = () => {
                        if (this.completed || (!this.downloading && !this.queued)) {
                            es.close();
                            this.eventSource = null;
                        }
                    };
                },

                async checkYtdlpUpdate() {
                    this.checkingUpdate = true;
                    try {
                        const response = await fetch('/api/ytdlp-update', {
                            method: 'POST',
                            headers: {
                                ...(this.authToken && { 'Authorization': `Bearer ${this.authToken}` })
                            }
                        });
                        const data = await response.json().catch(() => ({}));
                        if (data.success) {
                            const msg = data.data.status === 'updated' ? 'yt-dlp wurde aktualisiert!' : 'Bereits aktuell.';
                            this.toast(msg, 'success');
                        } else {
                            const detail = data.error ? String(data.error).replace(/^.*?: /, '').slice(0, 120) : '';
                            this.toast(detail ? `Update fehlgeschlagen: ${detail}` : 'Update fehlgeschlagen', 'error');
                        }
                    } catch (e) {
                        this.toast('Verbindungsfehler bei Update-Prüfung', 'error');
                    } finally {
                        this.checkingUpdate = false;
                    }
                },

                reset() {
                    this.url = '';
                    this.videoInfo = null;
                    this.format = 'video';
                    this.quality = 'best';
                    this.downloading = false;
                    this.completed = false;
                    this.queued = false;
                    this.progress = 0;
                    this.speed = null;
                    this.eta = null;
                    this.error = null;
                    this.downloadId = null;
                    this.downloadUrl = null;
                    this.selectedPlaylistUrls = [];
                    this.videoExpanded = false;
                    this.audioExpanded = false;
                    this.closeSSE();
                }
            }
        }
    </script>
</body>
</html>
